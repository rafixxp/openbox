<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NodePanel</title>
  <link rel="stylesheet" href="/vendor/xterm.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-mark"></span>
        <span class="logo-text">NodePanel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          Dashboard
        </a>
        <a href="#files" class="nav-item" data-page="files">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-8L10 4H4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1z"/></svg>
          File Manager
        </a>
        <a href="#services" class="nav-item" data-page="services">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="7" cy="16" r="1"/><path d="M6 7l3-3M12 6l2-2M16 7l3-3"/></svg>
          Services
        </a>
        <a href="#sites" class="nav-item" data-page="sites">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
          Websites
        </a>
        <a href="#database" class="nav-item" data-page="database">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          Database
        </a>
        <a href="#terminal" class="nav-item" data-page="terminal">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
          Terminal
        </a>
        <a href="#account" class="nav-item" data-page="account">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Account
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="account-row" id="sidebar-account">
          <span class="account-avatar" id="account-avatar">?</span>
          <div class="account-info">
            <span class="account-name" id="account-name">&nbsp;</span>
            <span class="account-host" id="account-host"></span>
          </div>
          <button class="btn btn-sm logout-btn" id="btn-logout" title="Keluar">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title" class="page-title">Dashboard</h1>
        <div class="topbar-right">
          <span id="topbar-host" class="muted mono"></span>
        </div>
      </header>
      <div id="page-content" class="content"></div>
    </main>
  </div>

  <div id="toast-area" class="toast-area"></div>
  <div id="modal-root"></div>

  <script src="/app.js"></script>
</body>
</html>
