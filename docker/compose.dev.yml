# Development stack for the Openbox panel.
#
#   cp panel/.env.example panel/.env
#   cp api/.env.example api/.env
#   docker compose -f docker/compose.dev.yml -f docker/build/privileged.override.yml \
#       --profile build up -d --build
#
# The build worker is intentionally behind the `build` profile and only becomes
# usable with the privileged override. Everything else runs unprivileged.

name: openbox

x-panel-build: &panel-build
  context: ../panel
  dockerfile: ../docker/php/Dockerfile
  additional_contexts:
    dockerassets: ../docker
  args:
    VITE_REVERB_APP_KEY: openbox-key
    VITE_REVERB_HOST: localhost
    VITE_REVERB_PORT: "8081"
    VITE_REVERB_SCHEME: http

x-panel-base: &panel-base
  image: openbox/panel:dev
  build: *panel-build
  env_file:
    - ../panel/.env
  volumes:
    - ../panel:/var/www/html
    - panel-vendor:/var/www/html/vendor
    - panel-storage:/var/www/html/storage
    - panel-bootstrap-cache:/var/www/html/bootstrap/cache
    - panel-build:/var/www/html/public/build
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openbox_panel
      POSTGRES_USER: openbox
      POSTGRES_PASSWORD: openbox-dev-password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbox -d openbox_panel"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: openbox
      MINIO_ROOT_PASSWORD: openbox-minio-password
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 openbox openbox-minio-password
        mc mb --ignore-existing local/openbox-artifacts
        mc anonymous set none local/openbox-artifacts
        echo "MinIO bucket openbox-artifacts ready"
    restart: "no"

  migrate:
    <<: *panel-base
    restart: "no"
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        php artisan config:clear
        php artisan migrate --force --no-interaction
        php artisan db:seed --force --no-interaction
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  panel:
    <<: *panel-base
    command: ["php-fpm"]
    expose:
      - "9000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../panel/public:/var/www/html/public:ro
      - panel-build:/var/www/html/public/build:ro
    ports:
      - 8080:80
    depends_on:
      - panel
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  horizon:
    <<: *panel-base
    command: ["php", "artisan", "horizon"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *panel-base
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  reverb:
    <<: *panel-base
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - 8081:8080
    depends_on:
      migrate:
        condition: service_completed_successfully

  build-agent:
    image: openbox/build-agent:dev
    build:
      context: ../api
      dockerfile: ../docker/agent/Dockerfile
    env_file:
      - ../api/.env
    environment:
      WORKER_ENABLED: "false"
    ports:
      - 127.0.0.1:8090:8090
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Privileged live-build runner. Requires:
  #   -f docker/build/privileged.override.yml --profile build
  build-worker:
    profiles: ["build"]
    image: openbox/build-worker:dev
    build:
      context: ../api
      dockerfile: ../docker/build/Dockerfile
    env_file:
      - ../api/.env
    environment:
      BUILD_SCRIPT: /opt/openbox/docker/scripts/build-iso.sh
      BUILD_SOURCE_ROOT: /workspace/source
      BUILD_WORK_DIR: /var/lib/openbox-build
      PANEL_INSTALLER_PATH: /workspace/source/install_panel_en.sh
      BUILD_AGENT_CALLBACK_URL: http://nginx
      ARTIFACT_DISK: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: openbox-artifacts
      S3_ACCESS_KEY_ID: openbox
      S3_SECRET_ACCESS_KEY: openbox-minio-password
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - ./scripts/build-iso.sh:/opt/openbox/docker/scripts/build-iso.sh:ro
      - ../:/workspace/source:ro
      - build-workspace:/var/lib/openbox-build
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  panel-vendor:
  panel-storage:
  panel-bootstrap-cache:
  panel-build:
  build-workspace:
